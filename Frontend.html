<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Smart Climate Control | ESP32 + DHT11</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0f;
            --bg-card: rgba(30, 30, 40, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-blue: #00f2ff;
            --neon-purple: #9d4edd;
            --success-green: #00f593;
            --danger-red: #ff006e;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 20px;
            overflow-x: hidden;
        }

        .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .connection-panel {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .status-indicator {
            width: 12px; height: 12px; border-radius: 50%;
            background: #444; transition: 0.3s;
        }

        .status-indicator.connected {
            background: var(--success-green);
            box-shadow: 0 0 10px var(--success-green);
        }

        .esp-input input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            padding: 10px 15px;
            border-radius: 12px;
            color: white;
            outline: none;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary { background: var(--neon-blue); color: #000; }
        .btn-primary:hover { opacity: 0.8; }

        /* Updated Grid for 3 Columns */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            transition: 0.3s;
        }

        .metric-card:hover { transform: translateY(-5px); border-color: var(--neon-blue); }

        .metric-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .metric-label { font-size: 0.85rem; text-transform: uppercase; color: var(--text-secondary); }
        .metric-value { font-size: 2.8rem; font-weight: 800; margin: 5px 0; }

        .chart-container {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 30px;
        }

        .last-update { font-size: 0.8rem; color: var(--text-secondary); text-align: center; }

        @media (max-width: 768px) {
            .metrics-grid { grid-template-columns: 1fr; }
            .connection-panel { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🏠 Smart Climate Control</h1>
            <p>ESP32 + DHT11 | Real-time ML Insights</p>
        </div>

        <div class="connection-panel">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="connectionText">Disconnected</span>
            </div>
            <div class="esp-input">
                <input type="text" id="espIP" placeholder="ESP32 IP Address" value="192.168.1.100">
                <button class="btn btn-primary" id="connectBtn">
                    <i class="fas fa-plug"></i> Connect
                </button>
            </div>
        </div>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-icon">🌡️</div>
                <div class="metric-label">Temperature</div>
                <div class="metric-value"><span id="temp">--</span>°C</div>
                <div id="tempStatus">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-icon">💧</div>
                <div class="metric-label">Humidity</div>
                <div class="metric-value"><span id="humidity">--</span>%</div>
                <div id="humStatus">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-icon">🎯</div>
                <div class="metric-label">ML Prediction</div>
                <div class="metric-value" style="font-size: 1.8rem; padding: 10px 0;">
                    <span id="comfort">--</span>
                </div>
                <div id="anomalyBox">--</div>
            </div>
        </div>

        <div class="chart-container">
            <h3 style="margin-bottom: 15px;"><i class="fas fa-chart-line"></i> Live Environmental History</h3>
            <canvas id="sensorChart" style="max-height: 300px;"></canvas>
        </div>

        <div class="last-update">
            Last update: <span id="lastUpdate">--:--:--</span>
        </div>
    </div>

    <script>
        let ESP_IP = "";
        let interval = null;
        let sensorChart;

        // Initialize Chart.js
        const ctx = document.getElementById('sensorChart').getContext('2d');
        sensorChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Temp (°C)',
                    borderColor: '#00f2ff',
                    backgroundColor: 'rgba(0, 242, 255, 0.1)',
                    data: [],
                    fill: true,
                    tension: 0.4
                }, {
                    label: 'Humidity (%)',
                    borderColor: '#9d4edd',
                    backgroundColor: 'rgba(157, 78, 221, 0.1)',
                    data: [],
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#fff' } } },
                scales: {
                    y: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#fff' } },
                    x: { grid: { display: false }, ticks: { color: '#fff' } }
                }
            }
        });

        // Connection Logic
        document.getElementById("connectBtn").addEventListener("click", () => {
            const ip = document.getElementById("espIP").value.trim();
            if (!ip) { alert("Please enter the ESP32 IP address from Serial Monitor."); return; }

            ESP_IP = "http://" + ip;
            document.getElementById("connectionText").innerText = "Connecting...";
            
            if (interval) clearInterval(interval);
            fetchData(); 
            interval = setInterval(fetchData, 2000); 
        });

        function fetchData() {
            fetch(ESP_IP + "/data")
                .then(res => res.json())
                .then(data => {
                    // Update Status
                    document.getElementById("statusIndicator").classList.add("connected");
                    document.getElementById("connectionText").innerText = "Connected Live";

                    // Update UI Numbers
                    document.getElementById("temp").innerText = data.temperature.toFixed(1);
                    document.getElementById("humidity").innerText = data.humidity.toFixed(0);
                    document.getElementById("comfort").innerText = data.prediction;

                    // Anomaly UI
                    const anomalyBox = document.getElementById("anomalyBox");
                    if(data.anomaly) {
                        anomalyBox.innerHTML = "<b style='color:#ff006e'>⚠️ ANOMALY DETECTED</b>";
                    } else {
                        anomalyBox.innerHTML = "<span style='color:#00f593'>Status: Stable</span>";
                    }

                    // Update Graph
                    const now = new Date().toLocaleTimeString();
                    if (sensorChart.data.labels.length > 15) {
                        sensorChart.data.labels.shift();
                        sensorChart.data.datasets[0].data.shift();
                        sensorChart.data.datasets[1].data.shift();
                    }
                    sensorChart.data.labels.push(now);
                    sensorChart.data.datasets[0].data.push(data.temperature);
                    sensorChart.data.datasets[1].data.push(data.humidity);
                    sensorChart.update();

                    document.getElementById("lastUpdate").innerText = now;
                })
                .catch(err => {
                    console.error("Fetch Error:", err);
                    document.getElementById("connectionText").innerText = "Connection Failed";
                    document.getElementById("statusIndicator").classList.remove("connected");
                });
        }
    </script>
</body>
</html>
