<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrary Companion Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        #game-wrapper {
            text-align: center;
        }
        #game-container {
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .instructions {
            color: white;
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
        }
        .instructions h2 {
            margin: 0 0 10px 0;
        }
        .instructions p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div id="game-container"></div>
        <div class="instructions">
            <h2>🎮 How to Play</h2>
            <p>🎤 Say commands like "Go Left", "Go Right", "Go Up", "Go Down"</p>
            <p>⌨️ Or use Arrow Keys as backup</p>
            <p>🏠 Guide the character from Home (Green) to School (Red)</p>
            <p>😈 Watch out! The character doesn't always listen!</p>
        </div>
    </div>
</body>
</html>
